name: CI - Yègo Dashboard

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Audit des dépendances
        run: npm audit --omit=dev --audit-level=high
        # Informatif tant que Next 14 (plus corrigé) est utilisé : à rendre
        # bloquant après la migration vers Next 15.5+.
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.yego.example.com/api/v1
